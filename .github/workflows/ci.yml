name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        run: pnpm format:check

      - name: Run build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Run lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        run: pnpm lint

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test

      - name: Validate commit messages
        if: ${{ !cancelled() && steps.install.outcome == 'success' && matrix.os == 'ubuntu-latest' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
          INITIAL_SHA: beab9aa59b238da13a277a0225262899cec2d176
        run: |
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$INITIAL_SHA"
          fi

          if [[ "$(git rev-parse --is-shallow-repository)" != "false" ]]; then
            echo "::error::Commit validation requires complete history."
            exit 1
          fi

          for sha in "$BASE_SHA" "$HEAD_SHA" "$INITIAL_SHA"; do
            if [[ ! "$sha" =~ ^[a-f0-9]{40}$ ]] || ! git cat-file -e "$sha^{commit}"; then
              echo "::error::Required commit history is missing or invalid."
              exit 1
            fi
          done

          if [[ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]]; then
            echo "::error::Checkout must match the event head SHA."
            exit 1
          fi

          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" \
            --git-log-args "^$INITIAL_SHA" --verbose

      - name: Verify working tree is unchanged
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "::error::Verification changed repository files."
            exit 1
          fi
