name: Feature
description: Propose new or improved functionality.
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Explain the purpose of the feature.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the expected result.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define inclusions and exclusions.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe alternatives and trade-offs.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define completion requirements.
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Specify verification checks.
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add additional details, dependencies, or constraints.
    validations:
      required: false
