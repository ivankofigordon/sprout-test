name: Bug
description: Report a bug.
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe the observed behaviour.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: Describe the expected behaviour.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: List prerequisites and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Specify platform, versions, and configuration.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define completion requirements.
    validations:
      required: false
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Specify verification checks.
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Add additional details, dependencies, or constraints.
    validations:
      required: false
